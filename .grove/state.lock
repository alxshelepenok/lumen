b B-05 status=invalidated_acceptable cynefin=complicated t_created=2026-09-18T19:27:58Z t_updated=2026-09-18T21:22:51Z "paginate() supports the Gatsby /page/N path shape"
  vm:
    | Probe paginate() with a custom paths function in the W-01 scaffold.
  threshold:
    | Generated routes include /page/2 style paths.
  result:
    | Astro 7.3.3 PaginateOptions offers pageSize, params, props and format(url) with no paths option; paginate() emitted /page/, /page/2/, /page/3/ with the first page at the route base, so the bare-first-plus-page-N shape is not reachable with paginate(); manual getStaticPaths produced the exact Gatsby shape (B-06).

