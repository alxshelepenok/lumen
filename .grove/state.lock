b B-04 status=validated cynefin=complicated t_created=2026-09-18T19:27:57Z t_updated=2026-09-18T20:12:16Z "Existing SCSS compiles under Vite with minimal changes"
  vm:
    | Compile main.scss in the W-01 scaffold and diff the emitted CSS custom properties.
  threshold:
    | No errors beyond import-path fixes and identical computed CSS custom properties.
  result:
    | main.scss compiled under Vite sass with no changes and the emitted CSS carries both palettes; spot check passed (--color-accent light 240 6% 96%, dark 240 4% 17%); full custom property diff stays with W-03.

b B-05 status=invalidated_acceptable cynefin=complicated t_created=2026-09-18T19:27:58Z t_updated=2026-09-18T19:50:17Z "paginate() supports the Gatsby /page/N path shape"
  vm:
    | Probe paginate() with a custom paths function in the W-01 scaffold.
  threshold:
    | Generated routes include /page/2 style paths.
  result:
    | Astro 7.3.3 PaginateOptions offers pageSize, params, props and format(url) with no paths option; paginate() emitted /page/, /page/2/, /page/3/ with the first page at the route base, so the bare-first-plus-page-N shape is not reachable with paginate(); manual getStaticPaths produced the exact Gatsby shape (B-06).

b B-06 status=validated cynefin=complicated t_created=2026-09-18T19:50:15Z t_updated=2026-09-18T19:50:16Z "Manual getStaticPaths emits the bare-first-plus-page-N URL set"
  vm:
