d D-11 status=superseded t_created=2026-09-18T20:20:48Z t_updated=2026-09-18T21:22:51Z "Commit conventions drive the 3.0.0 release"
  context:
    | semantic-release analyzes the branch history with the conventionalcommits preset and a custom release rule where the type major cuts a major release; the Gatsby to Astro migration must land as 3.0.0.
  options:
    | Mark every migration commit chore.
    | Use feat and refactor per commit plus one breaking cutover commit.
  decision:
    | Scopes are single word work areas only (deps, grove, release); astro is too generic so it is never a scope and empty scope beats a wrong one; types come from feat, fix, refactor, docs, chore and the migration cutover commit in W-13 uses the type major so semantic-release publishes 3.0.0.
  consequences:
    | Commit subjects stay area specific; release notes read as features and refactors of the migration with one major cutover entry.
  validation:
    | After merging major/astro into main, semantic-release publishes 3.0.0.

d D-12 status=superseded t_created=2026-09-18T20:34:58Z t_updated=2026-09-22T11:37:36Z "Commits and branches carry grove node ids"
  context:
    | The repo releases through semantic-release with the conventionalcommits preset and a custom release rule where the type major cuts a major release; work runs through the grove graph whose gate matches exact node ids in commit subjects, so ids in subjects also enable mechanical surface overflow detection.
  options:
    | Type with a scope word per area.
    | Bare type and title for every commit.
    | Node id first for grove work, bare title otherwise.
  decision:
    | Grove work commits as type: W-NN (title) or type: G-NN (title) with decision records as type: D-NN (title); non-grove commits use type: title; scopes after the type tag are never used. Branches follow type/(W|G)-NNN for grove work (feat, fix, refactor, docs, chore), plain type/* otherwise, dependabot/* untouched and major/* for breaking composite work such as major/astro.
  consequences:
    | Release notes show node ids next to subjects; grove gate overflow matching works mechanically; the W-13 cutover commits as major: W-13 (...) and semantic-release publishes 3.0.0.
  validation:
    | Merging major/astro into main publishes 3.0.0; grove gate reports overflows per work item.

d D-13 status=accepted t_created=2026-09-18T23:17:48Z t_updated=2026-09-18T23:27:16Z "Route module owns path shapes and kebab casing"
  context:
    | Route building is scattered: get-slug composes prefixes through toKebabCase, pagination concatenates path segments, islands normalize trailing slashes after the fact and listing pages inline their own href templates; the house reference centralizes this behind a Route class with builder factories.
  options:
    | Keep per-purpose helpers as today.
    | Central Route class with routes factories owning kebab casing and the trailing slash policy.
    | Plain string constants map without a class.
  decision:
    | src/utils/routes.ts exports a Route class (href for the trailing slash link form, url for absolute feed links without the slash, canonical for absolute with the slash) plus routes factories (home, post, page, category, tag, year, paginated); toKebabCase moves into the routes module as its private concern and the standalone to-kebab-case and with-trailing-slash utils retire once islands receive final hrefs.
  consequences:
    | Single owner of URL shapes; islands stop postprocessing hrefs; get-slug keeps only posts and pages id normalization; call sites are the six listing pages, the feed item mapper, pagination info and the slug derivations.
  validation:
    | Route diff of every listing and pagination href against the pre-refactor build.

d D-14 status=accepted t_created=2026-09-19T13:53:38Z t_updated=2026-09-22T11:09:14Z "Semantic document skeleton contract"
  context:
    | Markup today is div-only (div.layout, div.page > div.inner, div.post, div.sidebar > div.inner); there are no landmarks, no headings for sections, and the sidebar sits beside main content with no main at all. Distilled from two audited reference implementations plus the semantic-SEO skill: crawlers build a signal graph from the tag skeleton.
  decision:
    | Body: one skip-link then exactly one main#page[tabindex=-1][aria-labelledby=<page h1 id>]; the sidebar column lives INSIDE main as aside; header/footer only where real metadata exists (page-level footer optional, local article/section header/footer encouraged). Every section carries an h (visually-hidden class when design hides it); a block that cannot earn a heading must not become a section. article = content that keeps its meaning when lifted out (feed entries, posts, list items); section = a facet of one entity. Nesting is section/article only, one heading per article, hgroup pairs title+subtitle. Landmarks and anchored blocks get unique ids plus aria-labelledby to a real heading id; nav groups repeat heading suffixes or aria-labels so sibling landmarks stay uniquely named. Wrapper divs that exist only for styling are removed; CSS moves to the semantic element (body can be the grid).
  consequences:
    | Removes div.page/div.inner/div.layout wrappers; styles re-attach to main/aside/section/article; visually-hidden utility added; DOM node count drops; parity with the current render is the acceptance bar.
  validation:
    | Built-HTML inspection: one main, no orphan wrapper divs, every section has a heading, aria-labelledby refs resolve; visual parity across themes.

d D-15 status=accepted t_created=2026-09-19T13:53:39Z t_updated=2026-09-22T11:09:15Z "Anchored JSON-LD entity graph contract"
  context:
    | No structured data exists today. Reference implementations converge on one pattern: a single JSON-LD script per page carrying an @graph, where @id equals the node url and the url fragment names a slice of the page that exists as a real DOM id.
  decision:
    | One script[type=application/ld+json] per page with @context https://schema.org and a merged, @id-deduped @graph. Id grammar: {site}{path}#{slice} built by the Route class; static root ids for Person (#person), WebSite (#web), and site-level lists; dynamic per-page ids for #page, content (#article/#story), #breadcrumb, and list anchors. Person is the author/publisher hub (sameAs from contacts). WebSite is the isPartOf target for every page. Page nodes use mainEntity + reciprocal mainEntityOfPage, hasPart + reciprocal isPartOf. BlogPosting (headline, keywords from tags, ISO dates) for posts; Blog+WebPage multi-type node for the articles index; CollectionPage+WebPage for tag/category/year lists and hubs; BreadcrumbList on every non-home page whose last crumb fragment equals the page mainEntity fragment; ItemList with sequential 1-based positions for feeds and hub lists; SiteNavigationElement mirroring the sidebar nav ids. Every jsonld property must be visible in the UI (mirroring rule); every fragment must resolve to a DOM id.
  consequences:
    | Adds src/utils/seo graph builders + emitter component; Route gains slice-aware id()/href(); audits (D-18) enforce the contract; tests pin builders.
  validation:
    | Graph builder unit tests; JSON-LD audit green in dev on every page type.

d D-16 status=accepted t_created=2026-09-19T13:53:39Z t_updated=2026-09-22T11:09:15Z "Ordered machine-readable head contract"
  context:
    | Meta tags today: title/description/twitter/og via name= attributes (og metas must use property=), no robots directives, no og:url/site_name/locale, head order is ad-hoc.
  decision:
    | base-head emits ordered groups: charset+viewport; robots (default index, follow, max-image-preview:large, max-snippet:-1; noindex, follow for 404); description; title; canonical self-referencing; icons+manifest; og:* with property= (type, site_name, locale, title, description, url mirroring canonical, image with width/height/alt when present); twitter:* (card, title, description, image, image:alt); single JSON-LD script; sitemap link. Description doubles as og:description and the graph description.
  consequences:
    | meta.astro restructured into grouped base-head; og metas switch name= to property=; new robots/og:url/og:site_name/og:locale/generator tags.
  validation:
    | Built-HTML head inspection per page type; audit cross-checks description and lang mirrors.

d D-17 status=accepted t_created=2026-09-19T13:53:39Z t_updated=2026-09-22T11:09:15Z "LLM corpus surface contract"
  context:
    | No llms.txt, no full-text corpus endpoint today. Reference pattern: llms.txt as a curated index (H1 site name, blockquote description, grouped - [label](url): description lists) and llms-full.txt as the full markdown corpus (per page: title, URL, section, description, raw body), both prerendered text/plain endpoints excluded from the sitemap.
  decision:
    | Add src/pages/llms.txt.ts and llms-full.txt.ts Astro endpoints (GET, prerendered, text/plain; charset=utf-8). llms.txt indexes the home route, articles index, hubs, static pages and recent posts with descriptions. llms-full.txt emits the raw markdown body of every non-draft post and page in menu order with URL lines pointing at the canonical page. Sitemap filter excludes the .txt endpoints; robots.txt references the sitemap.
  consequences:
    | Two new routes; sitemap filter extended; raw body access required from the content layer.
  validation:
    | Built target/llms.txt and target/llms-full.txt content inspection; sitemap excludes them; bun tests for the generators.

d D-18 status=accepted t_created=2026-09-19T13:53:39Z t_updated=2026-09-22T11:09:15Z "Dev-time semantics audit contract"
  context:
    | Reference implementations keep the JSON-LD/DOM contract honest with a build- or dev-time audit that re-parses the rendered page; without it anchors drift silently.
  decision:
    | Two dev-only audits (import.meta.env.DEV) wired from the layout, failing loudly via console.error. JSON-LD audit: parse every ld+json script, flatten nodes; every node has @id+url, @id === url, same-page fragments resolve to real DOM ids, references resolvable, ListItem positions sequential from 1, last breadcrumb crumb fragment equals page mainEntity fragment, inLanguage equals html[lang], graph description equals meta description, keywords equal article:tag metas. Accessibility audit: every landmark (main/aside/nav/header/footer/section/article) named via aria-labelledby or aria-label; sibling landmarks of the same role uniquely named; anchored ids unique and resolvable, not inside aria-hidden/hidden subtrees; images have alt; headings non-empty; interactive elements named; anchored landmarks focusable (tabindex=-1, warn). DOM budget: warn past 1500 nodes or depth 32.
  consequences:
    | src/utils/audit module with tests on fixture DOMs; dev overlay errors drive fixes; audits never ship to production HTML.
  validation:
    | bun test for audit modules on fixtures; dev run shows zero errors on all page types.

d D-19 status=accepted t_created=2026-09-20T10:47:57Z t_updated=2026-09-22T11:09:15Z "Complete head and feed discoverability contract"
  context:
    | The head lacks feed autodiscovery, article published time, author meta and per-scheme browser theming; the agent endpoints exist but nothing visible links to them.
  decision:
    | base-head gains link rel=alternate application/atom+xml (feed autodiscovery), meta name=author on all pages, og article:published_time on post pages, og:image:alt falling back to the page description; base-layout emits color-scheme light dark plus per-scheme theme-color metas; the sidebar copyright footer links llms.txt and llms-full.txt visibly.
  consequences:
    | New props on base-head; theme css gains color-scheme per theme class; sidebar footer markup changes.
  validation:
    | Built head inspection per page type; audits green.

d D-20 status=accepted t_created=2026-09-20T10:48:08Z t_updated=2026-09-22T11:09:16Z "Fragment-carrying internal link grammar"
  context:
    | Audited reference pattern treats a same-origin link without a #fragment as a broken agent target; today only graph ids carry slices while plain hrefs do not.
  decision:
    | Every same-origin content link (sidebar menu, feed entries, breadcrumbs, buttons, tag pills, pagination) is built through Route.anchor(slice) so it lands on a named slice (#page or a content fragment); file-like paths and external hrefs stay exempt; the schema audit flags same-origin non-file links without fragments and same-page fragments that resolve to nothing.
  consequences:
    | Islands switch to anchor() hrefs; schema audit gains link checks; tests pin the grammar.
  validation:
    | Audit green across page types; bun tests.

d D-21 status=accepted t_created=2026-09-20T10:48:10Z t_updated=2026-09-22T11:09:16Z "Anchored navigation entities contract"
  context:
    | The graph contract promised SiteNavigationElement but never shipped it; posts have permalink heading anchors but no table of contents, so in-page navigation structure is invisible to agents.
  decision:
    | Post pages render nav#toc (aria-labelledby a real heading, ul#toc-list, links to heading ids) with a scroll-spy setting aria-current; the graph adds SiteNavigationElement plus WebPageElement #toc with an ItemList #toc-list and links the page through hasPart; the sidebar menu nav gets an id and a root-anchored SiteNavigationElement node mirroring its items on pages that render the sidebar.
  consequences:
    | New toc island plus a post grid column at wide breakpoints; postGraph accepts toc entries; sidebar nav gains ids; audits see more anchors.
  validation:
    | TOC links resolve to heading ids; audit green; visual check on narrow and wide viewports.

d D-22 status=accepted t_created=2026-09-20T10:48:19Z t_updated=2026-09-22T11:09:16Z "Generated social cards contract"
  context:
    | Posts without a social image emit no card metas at all (Q-05), while the audited reference generates a 1200x630 card at build from title, description and site line.
  decision:
    | A build-time generator renders deterministic og cards (title wrapped to a line budget, description, site line) for posts without socialImage, stored under public/generated/og and referenced by og:image and twitter:image with width, height and alt; Q-05 stays honored only for the no-generator fallback.
  consequences:
    | New rendering deps and a vendored OFL font; generation runs during post route building; llms and sitemap unaffected.
  validation:
    | Card files exist for posts lacking socialImage; head points at them; dimensions are 1200x630.

d D-23 status=accepted t_created=2026-09-20T20:36:50Z t_updated=2026-09-22T11:09:17Z "Visible breadcrumb placement contract"
  context:
    | The breadcrumb nav ships visually-hidden on post, collection and static pages, so the anchored BreadcrumbList graph has no visible counterpart and users get no orientation path.
  options:
    | OC1: keep the breadcrumb visually-hidden and rely on the JSON-LD BreadcrumbList alone.
    | OC2: visible breadcrumb island with contextual placement (post header centered under the toolbar, collections above the title).
    | OC3: layout-level breadcrumb rendered above every page including home.
  decision:
    | OC2: a visible breadcrumb island styled by its own CSS module; the post header renders toolbar, then centered breadcrumb with top spacing, then title; hub and term collection pages render the breadcrumb above the h1 through a named slot on the page island; static pages keep their existing breadcrumb-above-title order.
  consequences:
    | The post header DOM order changes to toolbar first and breadcrumb second, which puts the breadcrumb below the theme toggle and the home button on mobile; separators are CSS-generated so list textContent stays audit-clean; home and 404 stay breadcrumb-free.
  validation:
    | DOM measurements over the dev server at 375px and 1440px viewports plus the audit over a fresh build.

d D-24 status=accepted t_created=2026-09-20T20:55:54Z t_updated=2026-09-22T11:09:17Z "Table of contents rail contract"
  context:
    | The toc island renders inline above the post body in the flow at every width, pushing the body down and never staying visible while reading.
  options:
    | OC1: keep the toc inline above the body and leave the flow as is.
    | OC2: absolute rail inside the article carrying a sticky, viewport-centred nav anchored to the right screen edge, visually hidden below the lg breakpoint.
    | OC3: fixed-position toc panel outside the document flow at all widths.
  decision:
    | OC2: the toc island renders its nav inside an absolute rail spanning the article; from the lg breakpoint the nav is position sticky with top 50vh and a translateY(-50%) centering shift, the rail's right offset is calc((1070px - 100vw) / 2 + 24px) so the box keeps 24px from the right screen edge, and below lg the nav replicates the visually-hidden declarations inside its own module.
  consequences:
    | The rail is out of flow, so the post body starts right after the title and keeps its centered column; the anchored toc, toc-title and toc-list ids move one wrapper deeper but stay inside the article; the inline toc box above the body disappears at every width.
  validation:
    | DOM measurements over the dev server at 375px, 1100px and 1440px widths including sticky tracking across scroll positions, plus the audit over a fresh build.

d D-26 status=accepted t_created=2026-09-20T21:09:21Z t_updated=2026-09-22T11:09:17Z "Post toolbar as body-level chrome"
  context:
    | The theme toggle and the all-articles link render inside the article header of every post, mixing page chrome into article content.
  options:
    | OC1: keep the toolbar inside the article header.
    | OC2: toolbar island rendered at body level before main, fixed top-left from lg and in flow below.
    | OC3: toolbar as a grid sibling of the article inside main.
  decision:
    | OC2: a post-toolbar island renders before main on post pages, outside the article and the main landmark; below lg it is an in-flow centered flex row and from lg it keeps the fixed top 30px left 30px placement, so the body-level flow reproduces the old in-article pixel positions without grid-gap compensation (OC3 rejected for the 30px row gap it inserts below lg).
  consequences:
    | The post header starts with the breadcrumb line; the toolbar styles leave the post module for their own toolbar module; the theme toggle script keeps working because it queries by data attribute anywhere in the document.
  validation:
    | Width-sweep DOM measurements from 320px to 1920px proving the toolbar box never intersects content boxes and the mobile pixel positions are preserved.

d D-31 status=accepted t_created=2026-09-20T21:33:58Z t_updated=2026-09-22T11:09:19Z "Site footer with the machine surface links"
  context:
    | The machine endpoints (llms.txt, llms-full.txt, atom.xml, sitemap) are linked only from the head or the sidebar, so nothing at the bottom of the page exposes the machine surface to humans.
  options:
    | OC1: extend the sidebar copyright footer with atom and sitemap links.
    | OC2: a site-wide footer island as the last child of main with the file links right-aligned.
  decision:
    | OC2: a site-footer island renders as the last child of main on every page, holding llms.txt, llms-full.txt, atom.xml and sitemap.xml links (file-like hrefs, exempt from the fragment grammar); the row is right-aligned with no border, small muted typography and the page rhythm paddings; the copyright stays only in the sidebar footer.
  consequences:
    | The footer adds ten nodes per page inside the DOM budget; it sits inside main so it is not a page-level landmark and needs no accessible name; the sidebar footer keeps the copyright and its own links.
  validation:
    | DOM measurements at 375px and 1440px widths across page types proving placement, right alignment, zero border and the paddings, plus the audit over a fresh build.

d D-34 status=accepted t_created=2026-09-20T21:48:45Z t_updated=2026-09-22T11:09:20Z "Post body as plain content after the header"
  context:
    | The post body sits in a section#post-body labelled by the post title; the article already carries the semantics, so the nested section is a redundant landmark that only generates tabindex warnings.
  options:
    | OC1: keep the labelled section wrapper.
    | OC2: drop the wrapper and let the content elements flow directly under the article.
    | OC3: keep a div wrapper carrying the body column styles without the section element, id and label.
  decision:
    | OC3: the content renders inside a plain div with the body class directly after the header; OC2 was rejected because the content column styles need an ancestor and the Content component exposes no class hooks, so a wrapperless layout would force brittle per-tag global selectors.
  consequences:
    | The article keeps no section element and no post-body landmark; the id post-body disappears (nothing referenced it, the graph anchors the article through #article and #page); the boxes and the audit surface stay identical minus the post-body tabindex warning.
  validation:
    | DOM measurements at 375px and 1440px proving zero sections in the article, the header-to-content adjacency and unchanged boxes, plus the audit over a fresh build.

d D-35 status=accepted t_created=2026-09-20T21:52:08Z t_updated=2026-09-22T11:09:20Z "Feed item header with heading and mixin gap"
  context:
    | The feed item header holds only the time and category row while the heading sits outside it, and the gap between time and category comes from an empty divider span whose only job is margins.
  options:
    | OC1: keep the heading outside the header and the divider span.
    | OC2: move the heading into the header, drop the divider span and source the 26px gap from margin-left on the category through the margin mixin.
  decision:
    | OC2: the feed item header renders time, category and the h3 heading (mirroring the post header owning its title); the divider span disappears and the category carries margin-left of one leading unit (26px) through mixins.margin-left(1), reproducing the exact old gap of 13px plus 13px.
  consequences:
    | The feed loses one node per item; the heading keeps its .item .title descendant styles inside the header; article anchors and the graph stay untouched.
  validation:
    | DOM measurements at 375px and 1440px proving the header composition, the mixin-sourced gap and unchanged boxes, plus the audit over a fresh build.

d D-36 status=accepted t_created=2026-09-20T21:56:09Z t_updated=2026-09-22T11:09:20Z "Feed item read action in an item footer"
  context:
    | The feed item exposes the Read link as a bare anchor directly under the article, while the item already separates its masthead into a header; the trailing action deserves the matching bookend.
  options:
    | OC1: keep the bare anchor as the last article child.
    | OC2: wrap the Read anchor in a bare footer element as the last article child.
  decision:
    | OC2: a classless footer wraps the Read anchor; inside the article the footer stays a scoped non-landmark, the anchor keeps its class, styles and accessible name, and no new css rules are needed.
  consequences:
    | The feed gains one wrapper node per item; the anchor box, the description gap and the audit surface stay unchanged.
  validation:
    | DOM measurements at 375px and 1440px proving the wrapper and the unchanged anchor boxes, plus the audit over a fresh build.

d D-37 status=accepted t_created=2026-09-20T22:27:47Z t_updated=2026-09-22T11:09:16Z "No table of contents on post pages"
  context:
    | The user retired the table of contents: the sticky rail, its scroll-spy and its graph nodes all go. D-21 bundled the toc contract with the sidebar navigation entity, so the surviving sidebar half needs its own record.
  decision:
    | Post pages render no toc island: no rail, no nav#toc, no scroll-spy script, no heading-entry extraction; postGraph emits no toc nodes and no hasPart edge. The sidebar half of D-21 stands unchanged: the sidebar menu nav keeps its id and root-anchored SiteNavigationEntity with its ItemList on pages that render the sidebar.
  consequences:
    | Post markup loses the rail wrapper and one script; the graph loses the SiteNavigationEntity/ItemList pair per post and the page hasPart; toc labels leave the constants; heading anchors stay as plain permalinks with no observer.

d D-38 status=accepted t_created=2026-09-21T23:23:47Z t_updated=2026-09-22T11:09:28Z "Semantic rem scales replace leading arithmetic"
  context:
    | Spacing and type sizes derive from a 26px leading multiplied by unitless factors, so call sites like margin-top(0.5) equal 13px and cannot be explained, and px sizing blocks user font scaling.
  options:
    | Keep exact px equivalents written as rem.
    | Snap both scales to a 4px grid with named rem steps.
    | Introduce fluid clamp sizing between breakpoints.
  decision:
    | Snap typography and spacing to named rem steps on a 4px grid, written as literal rem values with no conversion function: font sizes sm 0.875rem, base 1rem, md 1.125rem, lg 1.25rem, xl 1.5rem, 2xl 1.75rem, 3xl 2rem, 4xl 2.5rem, 5xl 3rem; spacing 2xs 0.25rem, xs 0.5rem, sm 0.75rem, md 1rem, lg 1.5rem, xl 2rem, 2xl 3rem, 3xl 4rem, 4xl 6rem; line heights become unitless ratios; the font scale gains the lg step between md and xl.
  consequences:
    | Rendered sizes drift up to 4px against today, values become measurable for a user, and rem sizing tracks the user font preference.
  validation:
    | Before and after screenshots of home and a post at 375 and 1280 pixels.

d D-39 status=accepted t_created=2026-09-21T23:23:58Z t_updated=2026-09-22T11:09:28Z "Device anchored px stays outside the rem system"
  context:
    | Hairlines, off-screen helpers and raster image geometry describe device pixels or non-visual mechanics, not user measurable sizes.
  decision:
    | Border hairlines (1px), the visually hidden helper, the skip link off-screen offset target units aside from the spacing scale, satori og image geometry, srcset sizes attributes and inline svg stroke attributes keep their current units; the migration sweep greps with this whitelist.
  consequences:
    | The px sweep has a small stable whitelist and generated images stay pixel exact.

q Q-01 status=answered cynefin=complicated t_created=2026-09-18T19:27:12Z t_updated=2026-09-18T21:22:51Z "How strict must URL parity be?"
  why:
    | Astro paginate() can emit the exact Gatsby paths (/page/N) at the cost of custom path functions; relaxed shapes simplify routing but break inbound links unless redirects are added.
  exit:
    | The user confirms one of: exact parity, parity per D-06 with a written exception list, or new shapes plus redirects.
  outcome:
    | Strict parity per D-06: the exact current URL shapes stay and every page additionally emits a canonical link tag ending with a trailing slash; the Astro trailingSlash behaviour is confirmed in W-05 and W-06.

q Q-02 status=answered cynefin=complicated t_created=2026-09-18T19:27:13Z t_updated=2026-09-18T21:22:51Z "Which test strategy replaces the React component tests?"
  why:
    | D-02 removes React, so @testing-library/react, react-test-renderer and the snapshot suite lose their subject; Astro offers an experimental container API usually paired with vitest, while pure logic can stay on bun test.
  exit:
    | The user picks one of: container API tests for .astro components, logic tests only plus the W-12 parity gate, or both.
  outcome:
    | React component tests and snapshots are deleted together with the React layer; bun test keeps covering pure logic (utils, slug and taxonomy derivation) and the W-12 parity gate covers the UI.

q Q-03 status=answered cynefin=clear t_created=2026-09-18T19:27:13Z t_updated=2026-09-18T21:22:51Z "Which third-party services stay (Google Analytics, Sentry)?"
  why:
