b B-03 status=validated cynefin=complicated t_created=2026-09-18T19:27:57Z t_updated=2026-09-18T21:04:47Z "The Sentry Astro SDK supports Astro 7"
  vm:
    | Check the @sentry/astro peer range against astro 7.x and install it on the branch.
