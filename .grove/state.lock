y Y-01 status=active t_created=2026-09-18T20:12:16Z t_updated=2026-09-18T20:12:17Z "Vite CSS modules must mirror webpack camelCase exports"
  tags: css-modules, vite
  surface: astro.config.ts, src/assets/styles/modules
  invariant:
    | Porting webpack css-loader code to Vite requires css.modules.localsConvention camelCase so kebab-case scss classes stay reachable through camelCase keys.
  why:
    | Without it styles.sidebarAuthor silently resolves to undefined and wrapper classes vanish from the markup (observed in W-04 before the fix).

y Y-02 status=active t_created=2026-09-18T20:46:39Z t_updated=2026-09-18T20:46:40Z "Astro 7 needs explicit unified markdown setup"
  tags: sätteri
  surface: astro.config.ts, package.json
  invariant:
    | Astro 7 defaults to the Sätteri markdown processor; unified remark and rehype plugins require an explicit @astrojs/markdown-remark dependency and rehype-raw must run for raw HTML in markdown.
  why:
    | Without the dependency plugin configs fail validation, and without rehype-raw raw HTML like iframes silently disappears from the output (observed in W-07).

y Y-03 status=active t_created=2026-09-18T20:46:40Z t_updated=2026-09-18T20:46:40Z "Content layer images optimize only through render"
  tags: content-layer
  surface: src/islands/post-content.astro
  invariant:
    | entry.rendered.html carries __ASTRO_IMAGE_ placeholders; responsive image markup materializes only when the Content component returned by render(entry) renders.
  why:
    | Reading rendered.html directly leaks placeholder attributes and loses webp srcset optimization (observed in W-08).

y Y-04 status=active t_created=2026-09-18T20:55:35Z t_updated=2026-09-18T20:55:35Z "Port gatsby pagination as zero-based manual paths"
  tags: pagination
  surface: src/utils/get-pagination.ts, src/pages/page
  invariant:
    | Reproducing gatsby createPages pagination needs manual getStaticPaths paths where page indices are zero-based: the first extra route is /page/1 and page titles render the zero-based index.
  why:
    | Astro paginate() cannot place the first page on a bare route (B-05) and its 1-based numbering would shift every paginated URL and title (observed in W-06).

y Y-05 status=active t_created=2026-09-18T21:09:27Z t_updated=2026-09-18T23:08:55Z "Render feed content through the container API"
  tags: content-layer
  surface: src/pages/atom.xml.ts
  invariant:
    | Feed content that needs fully processed html can render the Content component to a string through experimental_AstroContainer instead of reading entry.rendered.html.
  why:
    | rendered.html leaks __ASTRO_IMAGE_ placeholders; the container render resolves them into optimized image markup (observed in W-09).

