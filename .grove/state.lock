    | rendered.html leaks __ASTRO_IMAGE_ placeholders; the container render resolves them into optimized image markup (observed in W-09).

y Y-06 status=active t_created=2026-09-18T21:22:50Z t_updated=2026-09-19T16:24:47Z "Freeze a reference build for migration parity gates"
  tags: parity
  invariant:
    | Framework migrations need a frozen reference build plus a mechanical route and head diff before the old stack is deleted; visual pairs close the loop with accepted-difference lists.
  why:
    | The W-12 gate caught only expected differences (tie order, empty description quirks) across 34 routes and both themes, giving the confidence to delete the Gatsby tree in W-13.

y Y-07 status=active t_created=2026-09-19T00:09:34Z t_updated=2026-09-19T00:09:35Z "Own rehype image pipeline replaces content layer images"
  tags: content-layer
  surface: internal/rehype-html.mjs
  invariant:
    | Astro hardcodes img markup for markdown images; the exact picture pattern requires an async rehype transform generating sharp variants beside the source and emitting the markup itself.
  why:
    | The content store caches rendered html by digest without tracking processor changes, so plugin iterations silently serve stale markup until the store is cleared (observed in W-47).

y Y-08 status=active t_created=2026-09-19T00:18:29Z t_updated=2026-09-19T16:24:47Z "Attribute sized images need the canonical height auto pair"
  tags: parity
  surface: src/assets/styles/base/_generic.scss
  invariant:
    | Whenever images carry natural width and height attributes and CSS constrains the width, the base stylesheet must pair max-width 100 percent with height auto or the attribute height stretches the box.
  why:
    | The same stretch bit twice: first when the astro responsive layer went missing (W-30) and again when that layer was removed with the astro pipeline (W-50).

y Y-09 status=active t_created=2026-09-19T15:41:08Z t_updated=2026-09-19T16:25:05Z "Semantic tag swaps keep pixels only with box-model parity"
  tags: css-modules, parity
  surface: src/assets/styles/modules
  invariant:
    | Replacing wrapper divs with semantic tags preserves rendering iff module classes re-attach to the new element AND grid items that gain padding switch to border-box AND collapsed inline wrappers re-pin explicit line-height: mixed font-size inline boxes measure taller than either font alone.
  why:
    | W-51/W-52 geometry parity held only after border-box on the padded aside; W-55 pagination lost 4px until line-height 30px replaced the old mixed-size line box.

y Y-10 status=active t_created=2026-09-19T16:24:09Z t_updated=2026-09-19T16:25:05Z "Graph ids are urls whose fragments ground in visible DOM"
  tags: json-ld, graph-anchor
  surface: src/utils/seo, src/utils/audit
  invariant:
    | A JSON-LD entity graph stays machine-honest iff every node has @id === url, global entities use static root-anchored ids, page entities use per-path ids, every same-page fragment resolves to a real DOM id, cross-page references are skipped rather than guessed, the last breadcrumb crumb targets the mainEntity fragment, and every emitted property mirrors visible content.
  why:
    | The integrity audit (W-68) plus mirror cross-checks (W-69) hold all ten page types to zero errors only because the id grammar is shared by links, DOM anchors and graph nodes.

y Y-11 status=active t_created=2026-09-19T16:24:22Z t_updated=2026-09-19T16:25:05Z "LLM surface is plain-text endpoints excluded from the sitemap"
  tags: llms, content-layer
  surface: src/pages/llms.txt.ts, src/pages/llms-full.txt.ts
  invariant:
    | Agent discoverability needs a curated index (H1 name, blockquote description, grouped [label](absolute-url): description lists) plus a full corpus endpoint (per entry: title heading, URL, description, raw markdown body, --- separators), both prerendered text/plain and filtered out of the sitemap alongside robots.txt.
  why:
    | The content layer exposes entry.body raw markdown, so the corpus is a pure read (Q-04) and the endpoints double as the conventional path agents probe first.

y Y-12 status=active t_created=2026-09-19T16:24:23Z t_updated=2026-09-19T16:25:05Z "Semantics audits must be pure functions over parsed input"
  tags: semantics-audit, graph-anchor
  surface: src/utils/audit
  invariant:
    | Dev-time audits stay testable and runnable at build time only when their checks are DOM-free functions over parsed input (graph objects, an element tree, anchor resolver callbacks) with a thin adapter collecting that input from the live document; wiring runs under import.meta.env.DEV so production HTML stays clean.
  why:
    | Bun fixtures and static-build sweeps (W-72, W-71) both drive the same pure core that the browser adapter feeds, catching seeded defects and real regressions alike.

y Y-13 status=active t_created=2026-09-20T10:51:54Z t_updated=2026-09-20T10:52:18Z "Head completeness is feed, article and theming metas plus visible agent links"
  tags: head-groups, llms
  surface: src/islands/base-head.astro, src/islands/base-layout.astro, src/islands/sidebar-copyright.astro
  invariant:
    | A static head is machine-complete iff it declares the atom alternate, the author, og article:published_time on articles, an alt for every emitted image (description as fallback), color-scheme plus per-scheme theme-color, and the agent endpoints (llms.txt, llms-full.txt) are reachable through visible footer links rather than hidden routes.
  why:
    | Feed consumers, social scrapers and browsers each read a different slice of the head; the audited reference heads ship all of these groups at once and keep agent endpoints linked where crawlers follow.

y Y-14 status=active t_created=2026-09-20T10:52:05Z t_updated=2026-09-20T10:52:18Z "Internal links must land on named slices"
  tags: link-grammar, graph-anchor
  surface: src/utils/routes.ts, src/utils/audit/schema-audit.ts, src/islands
  invariant:
    | Every same-origin content link carries a #fragment naming the slice it lands on (#page or a content anchor), file-like paths and external hrefs stay exempt, and an audit flags fragment-less internal links plus same-page fragments that resolve to nothing, because agents and assistive tech need a deterministic focus target identical to the graph id grammar.
  why:
    | The audited engines build links and graph ids from one Route grammar; the moment plain hrefs diverged, anchor drift appeared that only link-level audits caught.

y Y-15 status=superseded t_created=2026-09-20T10:52:05Z t_updated=2026-09-22T14:52:36Z "In-page navigation is an anchored SiteNavigationElement"
  tags: toc, json-ld, graph-anchor
  surface: src/utils/seo, src/islands
  invariant:
    | A table of contents and a site menu stay first-class entities iff each is a nav with a real heading or label, an id the graph can anchor, an ItemList mirroring the visible items with sequential positions, a scroll-spy that moves aria-current, and the page node references it through hasPart; markdown heading ids are safe toc input when the custom id plugin runs before the headings collector, which keeps existing ids.
  why:
    | Permalink heading anchors without a toc leave in-page structure invisible; the reference graphs ship both toc and menu as anchored navigation entities and their audits hold only because dom ids and item names mirror one to one.

y Y-16 status=active t_created=2026-09-20T10:52:06Z t_updated=2026-09-20T10:52:19Z "Social cards are generated at build from page metadata"
  tags: social-card
  surface: internal, src/pages/posts
  invariant:
    | Every post earns a rich card iff the build renders a deterministic 1200x630 image from the same title, description and site line the head emits (title wrapped to a line budget with ellipsis, curated socialImage always wins, dimensions and alt declared in metas), turning the no-image fallback from omission into generation.
  why:
    | The reference og renderer wraps text to a budget over a branded background and every post shares the card surface; hand-curated images only ever override it.

y Y-17 status=active t_created=2026-09-20T20:52:05Z t_updated=2026-09-20T20:52:27Z "Breadcrumb placement is contextual and CSS-only"
  tags: breadcrumb
  surface: src/islands/breadcrumb.astro, src/islands/post.astro, src/islands/page.astro, src/assets/styles/modules/breadcrumb.module.scss
  invariant:
    | The visible breadcrumb keeps one island and one CSS module; page-specific placement and spacing come from the consumer (post header order and margins, named breadcrumb slot above the h1 on the page island) while separators are CSS-generated, so list textContent and audit anchors stay untouched.

y Y-18 status=superseded t_created=2026-09-20T20:59:54Z t_updated=2026-09-22T11:08:51Z "Floating chrome rides absolute rails with sticky children"
  tags: toc
  surface: src/islands/toc.astro, src/assets/styles/modules/toc.module.scss, src/assets/styles/modules/post.module.scss
  invariant:
    | Viewport-anchored UI (toc rail, any future floating chrome) stays out of the post flow by riding an absolute full-article rail with a sticky child at top 50vh plus translateY(-50%); screen-edge offsets derive from calc((layout-width - 100vw) / 2 + gap) and the below-breakpoint state replicates the visually-hidden declarations inside the module.

y Y-19 status=superseded t_created=2026-09-20T21:06:13Z t_updated=2026-09-20T21:18:22Z "Breadcrumb nav carries slotted notes beside the trail"
  tags: breadcrumb
  surface: src/islands/breadcrumb.astro, src/islands/post.astro, src/assets/styles/modules/breadcrumb.module.scss
  invariant:
    | The breadcrumb island exposes a note slot rendered after the ordered list inside the nav; the nav is a baseline flex row so slotted notes (reading time) share the trail line with matching typography while the ordered list stays a pure trail and the notes stay outside it.

y Y-20 status=active t_created=2026-09-20T21:12:44Z t_updated=2026-09-20T21:13:00Z "Page chrome renders before main and inherits the flow it replaces"
  tags: post-toolbar
  surface: src/islands/post-toolbar.astro, src/assets/styles/modules/post-toolbar.module.scss, src/pages/posts/[...slug].astro
  invariant:
    | Post-page chrome that is not article content (toolbar, later floating controls) renders before the main landmark in its own island; below lg it stays an in-flow centered row and from lg it keeps the fixed top-left placement, so body-level flow reproduces the old in-article pixel positions and the fixed box never enters the content column.

y Y-21 status=active t_created=2026-09-20T21:18:16Z t_updated=2026-09-20T21:18:22Z "Meta line groups the trail nav and sibling notes"
  tags: breadcrumb
  surface: src/islands/breadcrumb.astro, src/islands/post.astro, src/assets/styles/modules/post.module.scss
  invariant:
    | The breadcrumb island stays a pure trail (nav with only its ordered list); non-trail metadata (reading time) renders as a sibling of the nav inside a consumer-owned baseline flex line that carries the margins, padding and gap, nullifying the nav side and bottom margins so the geometry matches an in-nav layout.

y Y-22 status=superseded t_created=2026-09-20T21:25:26Z t_updated=2026-09-20T21:32:54Z "Boilerplate chrome opts out of snippets and keeps its box"
  tags: post-toolbar
  surface: src/islands/sidebar-copyright.astro, src/assets/styles/modules/sidebar-copyright.module.scss, src/islands/post-toolbar.astro
  invariant:
    | Snippet-excludable chrome (copyright, post toolbar) carries data-nosnippet on its root; any landmark-shaped root (aside) gets an aria-label to satisfy the landmark audit, and any paragraph swapped for a span redeclares display block, line-height and margins in its module so the box stays pixel-identical.

y Y-23 status=superseded t_created=2026-09-20T21:29:59Z t_updated=2026-09-20T21:43:55Z "Regions name themselves through hidden scoped headings"
  tags: sidebar
  surface: src/islands/sidebar.astro
  invariant:
    | Composite regions (the sidebar column) render as sections whose first child is a visually hidden h2 carrying a content-derived name and whose aria-labelledby resolves to that heading; the name describes everything the region shows, never just its dominant block, and hidden headings follow the Site menu and Contacts pattern.

y Y-24 status=active t_created=2026-09-20T21:32:47Z t_updated=2026-09-20T21:47:06Z "Nosnippet rides div span or section inside named wrappers"
  tags: post-toolbar
  surface: src/islands/post-toolbar.astro, src/islands/sidebar-copyright.astro
  invariant:
    | data-nosnippet lives only on div, span or section elements; when the chrome also needs a landmark shape (aside), the landmark stays a bare named wrapper and the nosnippet element nests inside it, keeping its own class, styles and box.
  revalidation:
    | 2026-09-20T21:46:57Z from=D-33

y Y-25 status=superseded t_created=2026-09-20T21:39:15Z t_updated=2026-09-22T11:08:51Z "Machine surface links live in a right-aligned footer inside main"
  tags: sidebar
  surface: src/islands/site-footer.astro, src/assets/styles/modules/site-footer.module.scss, src/islands/layout.astro
  invariant:
    | The machine endpoints (llms.txt, llms-full.txt, atom.xml, sitemap) render as file-like hrefs in a site-wide footer island appended as the last child of main on every route; inside main the footer stays a non-landmark, carries no border, uses the page rhythm paddings and resets generic list item margins and padding so the right-aligned row lands exactly on the content column inset.

y Y-26 status=active t_created=2026-09-20T21:39:23Z t_updated=2026-09-20T21:39:30Z "Static sweeps must cover non-index html files"
  tags: link-grammar
  surface: internal/testing/audit.ts, src/pages/404.astro
  invariant:
    | The audit walks every emitted html document (index.html and 404.html), not only route indexes; a page type invisible to the sweep silently escapes the link grammar and anchor checks that the dev audits enforce.

y Y-27 status=active t_created=2026-09-20T21:43:47Z t_updated=2026-09-20T21:43:55Z "Composite regions carry a maintainer-chosen umbrella heading"
  tags: sidebar
  surface: src/islands/sidebar.astro
  invariant:
    | Composite regions (the sidebar column) are named by a short umbrella heading (Overview) chosen by the maintainer over enumerating the blocks; the heading stays visually hidden with an id wired through aria-labelledby, and nested blocks keep their own specific names (person, Site menu, Contacts).

y Y-28 status=active t_created=2026-09-20T21:50:53Z t_updated=2026-09-20T21:51:01Z "Article owns the semantics and wrappers stay transparent"
  tags: css-modules
  surface: src/islands/post.astro, src/assets/styles/modules/post.module.scss
  invariant:
    | The article element is the only semantic container of a post: the body renders in a plain class-carrying div right after the header with no nested section, no extra id and no label; layout wrappers stay semantically transparent and graph anchors live on the article and page slices only.

y Y-29 status=active t_created=2026-09-20T21:55:16Z t_updated=2026-09-20T21:55:25Z "Feed headers own their headings and gaps come from mixins"
  tags: css-modules
  surface: src/islands/feed.astro, src/assets/styles/modules/feed.module.scss
  invariant:
    | Feed item headers carry the full masthead (time, category, heading) like post headers own their titles; no empty spacer elements remain and every horizontal gap comes from the leading-unit margin mixins on real content elements.

y Y-30 status=active t_created=2026-09-20T22:04:03Z t_updated=2026-09-20T22:04:12Z "DOM labels and graph names share one constant source"
  tags: graph-anchor
  surface: src/constants/labels.ts, src/utils/seo/nodes.ts
  invariant:
    | Every user-facing heading, landmark label and chrome link text lives in src/constants/labels.ts; names the JSON-LD graph mirrors (On this page, Table of contents, Site menu, Articles) import the same constants the markup uses, so the audit name cross-checks can never drift apart through edits.

y Y-31 status=active t_created=2026-09-20T22:12:12Z t_updated=2026-09-20T22:13:13Z "Bare header and footer wrappers inside a scoped section are landmark-free and geometry-neutral"
  tags: scoped-wrapper
  surface: src/islands/page.astro, src/pages/index.astro, src/pages/tag/[...slug].astro, src/pages/category/[...slug].astro, src/pages/year/[...slug].astro
  invariant:
    | Structural chrome wrappers added inside a scoped region use bare semantic tags with no classes: a header wrapping the breadcrumb nav and h1, a footer wrapping the pagination nav, rendered only when the slot has content. Because they sit inside section.page the accessibility audit treats them as scoped (not landmarks, no name needed), and with no styles of their own their margins collapse through, so wrapper insertion keeps every rect byte-identical.

y Y-32 status=active t_created=2026-09-20T22:25:59Z t_updated=2026-09-20T22:26:04Z "The content column lives in per-element rules, not a wrapper"
  tags: content-column
  surface: src/islands/post.astro, src/assets/styles/modules/post.module.scss
  invariant:
    | Article content elements are styled as direct children: per-type margin caps reproduce the wrapper's 13px column inset and 640px content cap (lists add their 40px UA padding, pre its 32px to the margin cap), a descendant rule keeps the flat auto-margin 640px cap that suppresses UA blockquote side margins, and an lg typography carrier set plus a footer margin-top replace what the wrapper used to inherit and collapse. Removing a layout wrapper means re-deriving its padding, cap and inheritance per element; measurement catches what reasoning misses (UA margins, content-box padding).

y Y-33 status=active t_created=2026-09-20T22:31:15Z t_updated=2026-09-22T11:08:51Z "Toc removal is invisible to flow and graph audits"
  tags: toc
  surface: src/islands/post.astro, src/utils/seo/pages.ts
  invariant:
    | Removing the toc leaves nothing dangling because every layer referenced only its own anchors: the rail and scroll-spy script were out of flow (all flow rects byte-identical after removal), the graph nodes and hasPart edge carried only #toc fragments, and the heading anchors stay as plain permalinks no observer depends on. D-37 supersedes the toc half of D-21; the sidebar SiteNavigationEntity survives untouched.

y Y-34 status=active t_created=2026-09-20T22:54:30Z t_updated=2026-09-20T22:54:36Z "CSS icon sprite paints shape-only SVGs through masks"
  tags: css-icon-sprite
  surface: src/assets/styles/base/_icons.scss, src/assets/styles/modules/pagination.module.scss
  invariant:
    | The CSS sprite (base/_icons.scss) holds shape-only data-URI SVGs in --icon-* custom properties; consumers paint them on pseudo elements via mask with background-color: currentColor, so a single colorless asset follows the theme palette and every link state (foreground, muted, hover primary) without duplicates. Directional variants come from transforms (scaleX(-1)) rather than second assets; the astro icon-sprite component remains the carrier for content-embedded icons.

y Y-35 status=active t_created=2026-09-20T23:07:38Z t_updated=2026-09-20T23:07:43Z "Icons center on trimmed text boxes, not line boxes"
  tags: css-icon-sprite
  surface: src/islands/pagination.astro, src/assets/styles/modules/pagination.module.scss
  invariant:
    | Text paired with an icon in a flex row centers honestly only when the text box is trimmed to its ink: wrap the label in an element with text-box-trim: trim-both and text-box-edge: cap alphabetic, make the link flex with align-items: center, and keep the icon pseudo on the link itself. The trimmed cap-to-baseline box (18.2px for the 26px bold label) removes the half-leading that otherwise visually offsets the pair; unsupported engines fall back to the untrimmed line box without breaking layout.

y Y-36 status=active t_created=2026-09-20T23:43:06Z t_updated=2026-09-20T23:43:11Z "Post markdown ships beside its page as a text alternate"
  tags: llms
  surface: src/pages/posts/[...slug].md.ts, src/islands/base-head.astro
  invariant:
    | Every post's raw markdown body is served at /posts/<slug>.md via a literal-extension route file (same pattern as llms.txt.ts) and linked from the post head as link rel=alternate type=text/markdown with the page title plus " - Markdown source"; the sitemap filter excludes .md routes like other file-like endpoints, and the link grammar already exempts .md hrefs.

y Y-37 status=active t_created=2026-09-21T13:19:12Z t_updated=2026-09-21T13:19:18Z "Content lists carry their markers in a flex column"
  tags: content-column
  surface: src/assets/styles/mixins/_content-list.scss, src/assets/styles/modules/post.module.scss, src/assets/styles/modules/page.module.scss
  invariant:
    | Content lists drop the UA marker gutter: li becomes a flex row (align-items baseline) whose ::before is a fixed marker column (7px currentColor square for ul, counters for ol) with a 13px gap, so wrapped lines align under the first line and the indent equals the marker column. The rules live in mixins/_content-list.scss; posts scope them through > ul / > ol (cap formula 640 plus the 20px marker column) and static pages through > section ul / ol because their content sits inside article.page > section, which also keeps hub lists on the generic styles.

y Y-38 status=active t_created=2026-09-21T23:45:50Z t_updated=2026-09-21T23:46:10Z "Sizes and spacing live on named rem scales, not leading arithmetic"
  tags: rem-token-scale, leading-arithmetic
  surface: src/assets/styles/variables
  invariant:
    | Every font size, line height, spacing and layout constant in the styles tree resolves to a named rem token from the variables groups; no px to rem conversion function exists and device anchored 1px hairlines are the only px left.

y Y-39 status=active t_created=2026-09-22T11:22:54Z t_updated=2026-09-22T11:37:51Z "Commits and branches carry grove node ids"
  tags: commit-grammar
  surface: .releaserc
  invariant:
    | Commits and branches anchor on the grove node they serve: subjects read type: N-NN (title) for any node kind (W, G, D, Q, B, T, Y) with no scope after the type tag, non-grove commits read type: title, and every subject is a single line without a body.
    | Branches read type/N-NN for grove work, plain type/* otherwise, major/* for breaking composite work such as major/astro, and dependabot/* stays untouched.
    | Worked example: discovery work lands on branch chore/Y-39 with the single-line commit chore: Y-39 (distill the commit grammar discovery); feature work lands as feat: W-NN (title) on feat/W-NN.
    | The trailing historical form type: title (Y-NN) is retired by D-40.
  why:
    | semantic-release parses the types through the conventionalcommits preset in .releaserc while grove gate matches exact node ids in commit subjects for surface overflow detection; ids in subjects keep both pipelines mechanical. Distilled from archived D-12 after the null-distill of its goal left the convention absent from the discovery layer.
    | D-40 supersedes D-12 because the W-and-G-only branch rule and the trailing-id subjects left agents guessing; the worked example pins the recipe so the branch and subject come out right on the first attempt.

y Y-40 status=active t_created=2026-09-22T14:52:29Z t_updated=2026-09-22T14:52:36Z "Linked crumb urls match the visible breadcrumb hrefs"
  tags: link-grammar, breadcrumb
  surface: src/utils/seo/pages.ts, src/utils/audit/schema-audit.ts
  invariant:
    | Linked breadcrumb crumbs carry the same slice-anchored url the visible link lands on (#page for page targets, the list or article fragment for terminal crumbs), a cross-check compares every crumb url against the rendered nav#breadcrumb hrefs, and the sweep holds all page types to zero issues.

y Y-41 status=active t_created=2026-09-22T14:52:29Z t_updated=2026-09-22T14:52:36Z "Site chrome anchors to the website through isPartOf"
  tags: graph-anchor, json-ld
  surface: src/utils/seo/nodes.ts
  invariant:
    | Site-wide chrome (the sidebar menu and the contacts links) keeps one root-anchored id and asserts isPartOf the website on every page that renders it, and a blog posting belongs to the home-anchored blog node through isPartOf while its page link stays in mainEntityOfPage, so no chrome entity carries per-page isPartOf values.

y Y-42 status=active t_created=2026-09-22T14:52:29Z t_updated=2026-09-22T16:44:12Z "Frontmatter owns graph dates and http contact urls"
  tags: frontmatter, graph-anchor
