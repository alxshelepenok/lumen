d D-01 status=accepted t_created=2026-09-18T19:23:55Z t_updated=2026-09-18T21:22:51Z "Migrate to Astro 7"
  context:
    | Gatsby 5 is in maintenance mode while Astro 7 is the current stable major as of September 2026; the user directed the migration.
  options:
    | Stay on Gatsby 5.
    | Migrate to Astro latest major (7.x).
    | Migrate to another SSG (Next.js, SvelteKit).
  decision:
    | Migrate lumen to Astro 7 on branch feature/astro-migration, merged to main once goals verify.
  consequences:
    | Sourcing, routing and templating are rewritten; the build moves from Gatsby and webpack to Vite; React leaves the runtime if D-02 is accepted.
  validation:
    | G-01 through G-05 verified; W-12 parity report empty of differences.

d D-02 status=accepted t_created=2026-09-18T19:24:06Z t_updated=2026-09-18T21:22:51Z "Native Astro components without React runtime"
  context:
    | Only ThemeSwitcher is interactive; every other component renders statically, so React 18 plus the diesel state layer would ship as island overhead.
  options:
    | Keep React via the @astrojs/react integration.
    | Rewrite all components as native .astro with a vanilla theme script.
    | Hybrid: static .astro plus one React island for the theme toggle.
  decision:
    | Rewrite every component as native .astro; theme toggling runs as a small inline script per D-03; no React island ships.
  consequences:
    | React, react-dom, @testing-library/react and react-test-renderer leave the dependency tree; component testing is re-planned under Q-02; CSS Modules become Astro scoped styles or stay as .module.scss imports where practical.
  validation:
    | W-04 done; the client bundle contains no framework runtime.

