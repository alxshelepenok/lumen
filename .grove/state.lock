w W-01 type=spike status=done cynefin=complex t_created=2026-09-18T19:25:47Z t_updated=2026-09-18T23:59:47Z "Verify Astro 7 baseline on Bun (scaffold, content probe, dev and build)"
  goals: G-01, G-05
  fitness: G-01=+0, G-05=+0
  surface: astro.config.ts, package.json, src/env.d.ts, src/pages/index.astro, .gitignore, bun.lockb
  ac:
    | Scaffold exists on the branch: astro.config.ts, package.json pinned to astro 7.x and a placeholder src/pages/index.astro.
    | bun install, astro dev and astro build all complete with output static.
  exit:
    | A glob content collection with the lumen frontmatter schema loads the existing content directory, informing B-01.
    | sass compiles main.scss and Shiki renders a code block, informing B-04 and D-04.
    | paginate() with a custom path emits /page/N routes, informing B-05.
    | The spike closes with at least one produced D, Q or B record per I2.
  evidence_strategy:
    | Command transcripts of bun install, astro dev and astro build; astro --version output; links to the produced records.
  evidence:
    | bun add astro@^7: installed astro 7.3.3 with 1875 packages in 65.54s; bunx astro --version: v7.3.3.
    | Content probe: 5 posts and 2 pages loaded with the full zod schema; image() arrives through the schema context function and z imports from astro/zod because the astro:content z export is deprecated for removal in Astro 8.
    | Markdown and styles probe: code fence rendered by Shiki (astro-code github-dark); main.scss compiled with emitted CSS carrying both palettes.
    | Pagination probe: paginate() emitted /page/, /page/2/, /page/3/; manual getStaticPaths emitted /category/sample/, /category/sample/page/2/, /category/sample/page/3/ (see B-05 and B-06).
    | astro dev on port 4321 returned HTTP 200 on /, /probe/ and /page/2/ with collections live; server stopped after the check.
    | bun test: 99 pass, 4 fail, 315 expect calls; identical 99/4 result on a stashed clean tree, so every failure pre-exists on main and is unrelated to the scaffold.
    | Clean scaffold rebuild green: 1 page built; probe files and probe-content/ removed before commit.
    | Exit criteria closed: B-01 validated, B-04 validated, B-05 invalidated_acceptable with a working alternative, B-06 produced and validated.

w W-02 type=feature status=done cynefin=complicated t_created=2026-09-18T19:25:59Z t_updated=2026-09-18T21:22:51Z "Port content to Astro content collections (posts, pages, site config)"
  goals: G-01
  fitness: G-01=+1
  surface: content/, src/content.config.ts, internal/gatsby/on-create-node.ts, src/content.config.ts, src/utils/get-slug.ts, src/utils/get-slug.test.ts, src/utils/get-site-metadata.ts, src/utils/to-kebab-case.ts
  ac:
    | A content config defines posts and pages collections with a glob loader over content/ and a zod schema covering every frontmatter field.
    | Slug resolution matches Gatsby: the frontmatter slug wins, otherwise the directory-based path applies.
    | All 5 posts and 2 pages load without schema errors and a temporary invalid frontmatter fails the build.
    | tagSlugs and categorySlug derive through toKebabCase exactly as in on-create-node.
  hypothesis:
    | The content layer glob loader plus zod covers the lumen frontmatter shape, so sourcing moves off GraphQL without editing any content file.
  evidence_strategy:
    | Build log showing both collections loaded; a failing-build transcript with bad frontmatter; unit checks on slug derivation.
  evidence:
    | Collections live in src/content.config.ts: posts and pages glob loaders over content/ with full zod schemas (posts incl. draft, category, tags; pages without category or tags); z from astro/zod, image() from the schema context.
    | Slug parity: the glob loader honours the frontmatter slug as entry id (verified: posts ids are /posts/a-brief-history-of-typography style), so the Gatsby rule of frontmatter-slug-wins holds by construction; src/utils/get-slug.ts adds the /posts or /pages prefix only for directory derived ids; get-slug.test.ts 3 pass.
    | Invalid frontmatter fails the build: date not-a-date in one post produced InvalidContentEntryDataError naming posts and the entry id, exit code 9; reverted and rebuilt green afterwards.
    | Site config stays in content/config.json and is exposed typed through src/utils/get-site-metadata.ts (title, url, description, copyright, feedLimit, menu, author with contacts, googleAnalyticsId, pathPrefix).
    | bun test full suite: 109 pass, 4 fail (the pre-existing years failures only); bun run build:astro green with both collections synced.
    | Tag and category slugs derive through toKebabCase exactly as in on-create-node: getTagSlugs (trailing slash form /tag/kebab/) and getCategorySlug (/category/kebab); get-slug.test.ts now 5 pass.

