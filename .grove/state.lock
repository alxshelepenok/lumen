d D-05 status=accepted t_created=2026-09-18T19:24:19Z t_updated=2026-09-18T21:22:51Z "Content collections replace GraphQL sourcing"
  context:
    | Gatsby sources content through gatsby-source-filesystem and gatsby-transformer-remark queried via GraphQL; the Astro content layer loads markdown with glob loaders and zod schemas.
  options:
    | Astro content collections with a glob loader and zod schema.
    | Custom markdown handling in an Astro integration.
    | Migrate content to MDX.
  decision:
    | Define posts and pages collections in a content config with a zod schema covering the full frontmatter (title, date, template, draft, slug, category, tags, description, socialImage).
  consequences:
    | GraphQL queries, internal/gatsby/queries and the on-create-node slug logic are rewritten as collection transforms; content/config.json stays the single site metadata source.
  validation:
    | W-02 done; the schema rejects invalid frontmatter at build time.

d D-06 status=accepted t_created=2026-09-18T19:24:32Z t_updated=2026-09-18T21:22:51Z "URL parity including page pagination paths"
  context:
    | Gatsby emits /page/2 style pagination paths from createPages while Astro paginate() defaults to /2 unless paths are customised.
  options:
    | Strict parity with /page/N via custom paginate paths.
    | Accept Astro default /N shapes.
    | New shapes plus redirect rules.
  decision:
    | Generate the exact Gatsby URL set: /, /page/N, /category/:slug plus pagination, /tag/:slug plus pagination, /year/:yyyy plus pagination, /categories, /tags, /years, /404 and the post and page slugs.
    | Additionally every page emits a canonical link tag whose absolute URL ends with a trailing slash; the Astro trailingSlash behaviour is confirmed while building W-05 and W-06.
  consequences:
    | paginate() receives custom path functions; the strictness level is confirmed under Q-01 before W-05 and W-06 start.
  validation:
    | W-12 route diff between the Gatsby and Astro builds is empty.

d D-11 status=superseded t_created=2026-09-18T20:20:48Z t_updated=2026-09-18T21:22:51Z "Commit conventions drive the 3.0.0 release"
  context:
    | semantic-release analyzes the branch history with the conventionalcommits preset and a custom release rule where the type major cuts a major release; the Gatsby to Astro migration must land as 3.0.0.
  options:
    | Mark every migration commit chore.
    | Use feat and refactor per commit plus one breaking cutover commit.
  decision:
    | Scopes are single word work areas only (deps, grove, release); astro is too generic so it is never a scope and empty scope beats a wrong one; types come from feat, fix, refactor, docs, chore and the migration cutover commit in W-13 uses the type major so semantic-release publishes 3.0.0.
  consequences:
    | Commit subjects stay area specific; release notes read as features and refactors of the migration with one major cutover entry.
  validation:
    | After merging major/astro into main, semantic-release publishes 3.0.0.

d D-12 status=accepted t_created=2026-09-18T20:34:58Z t_updated=2026-09-18T21:22:51Z "Commits and branches carry grove node ids"
  context:
    | The repo releases through semantic-release with the conventionalcommits preset and a custom release rule where the type major cuts a major release; work runs through the grove graph whose gate matches exact node ids in commit subjects, so ids in subjects also enable mechanical surface overflow detection.
  options:
    | Type with a scope word per area.
    | Bare type and title for every commit.
    | Node id first for grove work, bare title otherwise.
  decision:
    | Grove work commits as type: W-NN (title) or type: G-NN (title) with decision records as type: D-NN (title); non-grove commits use type: title; scopes after the type tag are never used. Branches follow type/(W|G)-NNN for grove work (feat, fix, refactor, docs, chore), plain type/* otherwise, dependabot/* untouched and major/* for breaking composite work such as major/astro.
  consequences:
    | Release notes show node ids next to subjects; grove gate overflow matching works mechanically; the W-13 cutover commits as major: W-13 (...) and semantic-release publishes 3.0.0.
  validation:
    | Merging major/astro into main publishes 3.0.0; grove gate reports overflows per work item.

d D-13 status=accepted t_created=2026-09-18T23:17:48Z t_updated=2026-09-18T23:27:16Z "Route module owns path shapes and kebab casing"
  context:
    | Route building is scattered: get-slug composes prefixes through toKebabCase, pagination concatenates path segments, islands normalize trailing slashes after the fact and listing pages inline their own href templates; the house reference centralizes this behind a Route class with builder factories.
  options:
    | Keep per-purpose helpers as today.
    | Central Route class with routes factories owning kebab casing and the trailing slash policy.
    | Plain string constants map without a class.
  decision:
    | src/utils/routes.ts exports a Route class (href for the trailing slash link form, url for absolute feed links without the slash, canonical for absolute with the slash) plus routes factories (home, post, page, category, tag, year, paginated); toKebabCase moves into the routes module as its private concern and the standalone to-kebab-case and with-trailing-slash utils retire once islands receive final hrefs.
  consequences:
    | Single owner of URL shapes; islands stop postprocessing hrefs; get-slug keeps only posts and pages id normalization; call sites are the six listing pages, the feed item mapper, pagination info and the slug derivations.
  validation:
    | Route diff of every listing and pagination href against the pre-refactor build.

q Q-01 status=answered cynefin=complicated t_created=2026-09-18T19:27:12Z t_updated=2026-09-18T21:22:51Z "How strict must URL parity be?"
  why:
    | Astro paginate() can emit the exact Gatsby paths (/page/N) at the cost of custom path functions; relaxed shapes simplify routing but break inbound links unless redirects are added.
  exit:
    | The user confirms one of: exact parity, parity per D-06 with a written exception list, or new shapes plus redirects.
  outcome:
    | Strict parity per D-06: the exact current URL shapes stay and every page additionally emits a canonical link tag ending with a trailing slash; the Astro trailingSlash behaviour is confirmed in W-05 and W-06.

q Q-02 status=answered cynefin=complicated t_created=2026-09-18T19:27:13Z t_updated=2026-09-18T21:22:51Z "Which test strategy replaces the React component tests?"
  why:
    | D-02 removes React, so @testing-library/react, react-test-renderer and the snapshot suite lose their subject; Astro offers an experimental container API usually paired with vitest, while pure logic can stay on bun test.
  exit:
    | The user picks one of: container API tests for .astro components, logic tests only plus the W-12 parity gate, or both.
  outcome:
    | React component tests and snapshots are deleted together with the React layer; bun test keeps covering pure logic (utils, slug and taxonomy derivation) and the W-12 parity gate covers the UI.

q Q-03 status=answered cynefin=clear t_created=2026-09-18T19:27:13Z t_updated=2026-09-18T21:22:51Z "Which third-party services stay (Google Analytics, Sentry)?"
  why:
    | The current build wires gtag with a live tracking id and Sentry browser tracking with a DSN from the environment; both need explicit consent to carry over.
  exit:
    | The user names the services to keep and any constraints (self-hosted, Partytown, sampling rates).
  outcome:
    | Both services stay: Sentry wires through the official Astro integration (validated by B-03) keeping browser tracking and replay with the current sampling rates; Google Analytics loads as a plain gtag script emitted from a small island in the head, with the current tracking id.

